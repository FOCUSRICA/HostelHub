
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HostelHub — Supabase Auth Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      color: #222;
    }

    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px #0000000d;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #d93670;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #auth-result {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>HostelHub Auth Test</h1>
    <p>
      This temporary page tests Supabase student registration
      and sign-in. It does not replace your existing login.
    </p>

    <form id="register-form">
      <label for="full-name">Full name</label>
      <input id="full-name" type="text" required>

      <label for="email">Email address</label>
      <input id="email" type="email" required>

      <label for="phone">Phone number</label>
      <input id="phone" type="tel">

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit">Register test student</button>
    </form>

    <form id="signin-form">
      <h2>Sign in</h2>

      <label for="signin-email">Email address</label>
      <input
        id="signin-email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="signin-password">Password</label>
      <input
        id="signin-password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign in</button>
    </form>

    <button id="signout-button" type="button" hidden>
      Sign out
    </button>

    <p id="auth-result" role="status" aria-live="polite">
      Ready to test Supabase authentication.
    </p>
  </main>

  <script type="module" src="js/supabase-auth-test.js"></script>
</body>
</html>
